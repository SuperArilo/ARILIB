[changelog]
header = """
## 📦 ARILIB-API 更新 \n
"""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- ARILIB-API changelog generated by git-cliff -->
"""
trim = true

[git]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"

conventional_commits = true
filter_unconventional = false
commit_parsers = [
    { message = "^[增|添]加", group = "Added" },
    { message = "^支持", group = "Added" },
    { message = "^新增", group = "Added" },
    { message = "^删除", group = "Removed" },
    { message = "^移除", group = "Removed" },
    { message = "^修复", group = "Fixed" },
    { message = "^修正", group = "Fixed" },
    { message = "^更改", group = "Changed" },
    { message = "^更新", group = "Changed" },
    { message = "^重构", group = "Changed" },
    { message = "^优化", group = "Changed" },
    { message = "^调整", group = "Changed" },

    { message = "^feat", group = "Added" },
    { message = "^feature", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^docs", group = "Documentation" },
    { message = "^style", group = "Style" },
    { message = "^refactor", group = "Refactored" },
    { message = "^perf", group = "Performance" },
    { message = "^test", group = "Testing" },
    { message = "^chore", group = "Changed" },
    { message = "^build", group = "Changed" },
    { message = "^ci", group = "Changed" },

    { message = "^[aA]dd", group = "Added" },
    { message = "^[sS]upport", group = "Added" },
    { message = "^[rR]emove", group = "Removed" },
    { message = "^[dD]elete", group = "Removed" },

    { message = "^.*: add", group = "Added" },
    { message = "^.*: support", group = "Added" },
    { message = "^.*: remove", group = "Removed" },
    { message = "^.*: delete", group = "Removed" },
    { message = "^.*: fix", group = "Fixed" },

    { message = "^.*", group = "Changed" },
]

filter_commits = false
topo_order = false
sort_commits = "newest"
